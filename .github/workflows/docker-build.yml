name: My first CI Pipeline - Docker build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  jb-docker-image:
    runs-on: ubuntu-latest
    
    steps:
    -  name: Checkout repository
       uses: actions/checkout@v4
    
    -  name: Build Docker image
       run: docker build -t my-nginx .
